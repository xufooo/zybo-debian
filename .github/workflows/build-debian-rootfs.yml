# ============================================================================
# build-debian-rootfs.yml — build the ZYBO (Zynq-7000, armhf) Debian rootfs
# ============================================================================
# Userspace (rootfs) only; kernel/DTB/U-Boot come from zybo-linux and zybo-buildroot.
# Toolchain: mmdebstrap + qemu-user-static (cross-arch second stage), no KVM needed.
# Artifacts (artifact: debian-rootfs): rootfs.ext4
# Notes:
#   - Defaults to trixie (current stable; armhf is one of the initial release
#     architectures); bookworm (LTS) can be selected instead
#   - iproute2/iputils-ping: mmdebstrap minbase has neither ip nor ping, so there is
#     no way to inspect the network on the board
#   - sox: generate test audio on the board (no need to push files from the host)
#   - bluez: bluez-alsa is only an ALSA plugin; without the bluez daemon Bluetooth
#     cannot come up at all
#   - nano/rsync/mpg123/usbutils/python3: edit/transfer files, quick sound checks,
#     debugging and scripting on the board
#   - USB WiFi: wpasupplicant/iw/rfkill/wireless-regdb + common firmware
#     (firmware-realtek/mediatek/atheros/misc-nonfree). Kernel-side drivers are in
#     zybo-linux's config.fragment (rtl8xxxu / rtw88 USB / mt7601u / mt76 / rt2800usb / ath9k_htc).
#   - mmdebstrap does not install Recommends by default, hence the explicit
#     --aptopt='Apt::Install-Recommends "true"'
#   - the scripts in hooks/ run inside the chroot: they write fstab/hostname/asound.conf
#     and enable services
# ============================================================================
name: Build ZYBO Debian Rootfs

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Debian suite (trixie | bookworm)'
        required: false
        default: 'trixie'
      extra_packages:
        description: 'Extra packages, comma separated'
        required: false
        default: ''

concurrency:
  group: zybo-debian
  cancel-in-progress: true

env:
  SUITE: ${{ github.event.inputs.suite || 'trixie' }}
  BASE_PACKAGES: "systemd,systemd-sysv,systemd-timesyncd,alsa-utils,sox,mpd,mpc,shairport-sync,avahi-daemon,avahi-utils,bluez,bluez-alsa-utils,libasound2-plugin-bluez,i2c-tools,iproute2,iputils-ping,openssh-server,sudo,curl,ca-certificates,locales,tzdata,nano,rsync,mpg123,usbutils,python3,wpasupplicant,iw,rfkill,wireless-regdb,firmware-realtek,firmware-mediatek,firmware-atheros,firmware-misc-nonfree"

jobs:
  build:
    name: Build Debian armhf rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap qemu-user-static binfmt-support arch-test \
            debian-archive-keyring e2fsprogs fakeroot zstd

      - name: Check binfmt
        run: |
          ls /proc/sys/fs/binfmt_misc/ | grep -i qemu || sudo update-binfmts --enable qemu-arm

      - name: Build rootfs (mmdebstrap → tar + tar.zst)
        run: |
          PKGS="$BASE_PACKAGES"
          if [ -n "${{ github.event.inputs.extra_packages }}" ]; then
            PKGS="$PKGS,${{ github.event.inputs.extra_packages }}"
          fi
          echo "suite=$SUITE"
          echo "packages=$PKGS"
          # ZYBO_FILES lets the hooks reach files in the repository's files/ (e.g. asound.state)
          # NOTE: non-free-firmware must be listed explicitly: firmware-realtek/mediatek/
          #    atheros/misc-nonfree live in that component, and with only main mmdebstrap
          #    simply fails to find the packages.
          sudo ZYBO_FILES="$PWD/files" mmdebstrap \
            --components=main,contrib,non-free,non-free-firmware \
            --architectures=armhf \
            --variant=minbase \
            --aptopt='Apt::Install-Recommends "true"' \
            --include="$PKGS" \
            --hook-dir="$PWD/hooks" \
            --format=tar \
            "$SUITE" rootfs.tar 2>&1 | tee mmdebstrap.log
          zstd -19 -T0 rootfs.tar -o rootfs.tar.zst
          ls -la rootfs.tar rootfs.tar.zst

      - name: Build ext4 image (optional, for dd)
        run: |
          mkdir -p rootfs-dir
          # NOTE: unpacking and mke2fs must run in the SAME fakeroot session:
          # tar's chown is only a virtual record under fakeroot and is lost when the
          # session ends, so running them separately (fakeroot tar ... then fakeroot
          # mke2fs ...) makes mke2fs see the real on-disk ownership and every non-root
          # owner is lost in the ext4 image -- /var/lib/mpd becomes root:root (the mpd
          # user cannot write tag_cache and MPD fails to start) and the group of
          # /etc/shadow becomes 0. tar itself is fine (102/29); only the ext4 step breaks.
          fakeroot -- sh -c '
            set -e
            tar -xpf rootfs.tar -C rootfs-dir
            SIZE_MB=$(( $(du -sm rootfs-dir | cut -f1) + 96 ))
            mke2fs -t ext4 -L rootfs -d rootfs-dir -F rootfs.ext4 "${SIZE_MB}M"
          '
          ls -la rootfs.ext4

      - name: Verify ownership survived into the ext4 image
        run: |
          # Spot-check a few non-root owners: if this fails, the fakeroot session above was split again
          check() { # check <path> <regex>
            if debugfs -R "stat $1" rootfs.ext4 2>/dev/null | grep -qE "$2"; then
              echo "  OK   $1  ($2)"
            else
              debugfs -R "stat $1" rootfs.ext4 2>/dev/null | grep -E 'User:|Group:|Mode:'
              echo "::error::ownership/permissions of $1 did not reach ext4 (expected $2)"
              exit 1
            fi
          }
          check /var/lib/mpd        'User: *102'
          check /var/lib/mpd/music  'User: *102'
          check /etc/shadow         'Group: *42'
          check /usr/bin/sudo       'Mode: *04755'
          echo "ext4 ownership/permissions preserved"

      - name: Verify defaults landed in the image
        run: |
          check() { # check <path> <description>
            if debugfs -R "stat $1" rootfs.ext4 >/dev/null 2>&1; then
              echo "  OK   $1  ($2)"
            else
              echo "::error::missing $1 in the image ($2)"
              exit 1
            fi
          }
          check /etc/systemd/network/10-eth0.link  "interface pinned to eth0"
          check /var/lib/alsa/asound.state         "initial volume"
          check /etc/localtime                     "time zone Asia/Shanghai"
          check /etc/motd                          "login banner"

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-rootfs
          path: |
            rootfs.tar.zst
            rootfs.ext4
          if-no-files-found: error
          retention-days: 14

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debian-build-log
          path: mmdebstrap.log
          if-no-files-found: ignore
          retention-days: 7
