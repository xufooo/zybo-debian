# ============================================================================
# build-debian-rootfs.yml — ZYBO (Zynq-7000, armhf) Debian rootfs 构建
# ============================================================================
# 只构建用户空间（rootfs）；内核/DTB/U-Boot 复用 zybo-linux 与 zybo-buildroot 的产物。
# 工具链：mmdebstrap + qemu-user-static（跨架构二阶段），无需 KVM。
# 产物（artifact: debian-rootfs）：rootfs.ext4
# 说明：
#   - 默认 trixie（当前 stable，armhf 在初始发布架构内）；可切 bookworm（LTS）
#   - iproute2/iputils-ping：mmdebstrap minbase 连 ip/ping 都没有，上板没法查网络
#   - sox：板端生成测试音频（不用从主机推文件）
#   - bluez：bluez-alsa 只是 ALSA 插件，没有 bluez 守护进程蓝牙根本起不来
#   - nano/rsync/mpg123/usbutils/python3：板端编辑/传文件/快速验声/调试/写脚本
#   - USB WiFi：wpasupplicant/iw/rfkill/wireless-regdb + 常见固件
#     （firmware-realtek/mediatek/atheros/misc-nonfree）。内核侧驱动见 zybo-linux
#     的 config.fragment（rtl8xxxu / rtw88 USB / mt7601u / mt76 / rt2800usb / ath9k_htc）。
#   - mmdebstrap 默认不装 Recommends → 显式 --aptopt='Apt::Install-Recommends "true"'
#   - hooks/ 内的脚本在 chroot 中执行：写 fstab/hostname/asound.conf、启用服务
# ============================================================================
name: Build ZYBO Debian Rootfs

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Debian suite (trixie | bookworm)'
        required: false
        default: 'trixie'
      extra_packages:
        description: 'Extra packages, comma separated'
        required: false
        default: ''

concurrency:
  group: zybo-debian
  cancel-in-progress: true

env:
  SUITE: ${{ github.event.inputs.suite || 'trixie' }}
  BASE_PACKAGES: "systemd,systemd-sysv,systemd-timesyncd,alsa-utils,sox,mpd,mpc,shairport-sync,avahi-daemon,avahi-utils,bluez,bluez-alsa-utils,libasound2-plugin-bluez,i2c-tools,iproute2,iputils-ping,openssh-server,sudo,curl,ca-certificates,locales,tzdata,nano,rsync,mpg123,usbutils,python3,wpasupplicant,iw,rfkill,wireless-regdb,firmware-realtek,firmware-mediatek,firmware-atheros,firmware-misc-nonfree"

jobs:
  build:
    name: Build Debian armhf rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap qemu-user-static binfmt-support arch-test \
            debian-archive-keyring e2fsprogs fakeroot zstd

      - name: Check binfmt
        run: |
          ls /proc/sys/fs/binfmt_misc/ | grep -i qemu || sudo update-binfmts --enable qemu-arm

      - name: Build rootfs (mmdebstrap → tar + tar.zst)
        run: |
          PKGS="$BASE_PACKAGES"
          if [ -n "${{ github.event.inputs.extra_packages }}" ]; then
            PKGS="$PKGS,${{ github.event.inputs.extra_packages }}"
          fi
          echo "suite=$SUITE"
          echo "packages=$PKGS"
          # ZYBO_FILES 让 hook 能取到仓库 files/ 里的文件（如 asound.state）
          # ⚠️ 必须显式带上 non-free-firmware：firmware-realtek/mediatek/atheros/
          #    misc-nonfree 都在该组件里；只给 main 的话 mmdebstrap 直接找不到包
          #    （实测踩过：构建 5 分钟就失败）。
          sudo ZYBO_FILES="$PWD/files" mmdebstrap \
            --components=main,contrib,non-free,non-free-firmware \
            --architectures=armhf \
            --variant=minbase \
            --aptopt='Apt::Install-Recommends "true"' \
            --include="$PKGS" \
            --hook-dir="$PWD/hooks" \
            --format=tar \
            "$SUITE" rootfs.tar 2>&1 | tee mmdebstrap.log
          zstd -19 -T0 rootfs.tar -o rootfs.tar.zst
          ls -la rootfs.tar rootfs.tar.zst

      - name: Build ext4 image (optional, for dd)
        run: |
          mkdir -p rootfs-dir
          # ⚠️ 解包与 mke2fs 必须在**同一个 fakeroot 会话**里：
          # tar 的 chown 在 fakeroot 下只是"虚拟记录"，会话一结束就没了；分开写
          # （fakeroot tar ... 然后 fakeroot mke2fs ...）会让 mke2fs 看到真实的
          # 磁盘属主，结果 ext4 里所有非 root 属主全丢 —— 实测 /var/lib/mpd 变成
          # root:root（mpd 用户写不了 tag_cache，MPD 起不来）、/etc/shadow 的
          # shadow 组变 0。tar 本身是对的（102/29），坏的只有 ext4 这一步。
          fakeroot -- sh -c '
            set -e
            tar -xpf rootfs.tar -C rootfs-dir
            SIZE_MB=$(( $(du -sm rootfs-dir | cut -f1) + 96 ))
            mke2fs -t ext4 -L rootfs -d rootfs-dir -F rootfs.ext4 "${SIZE_MB}M"
          '
          ls -la rootfs.ext4

      - name: Verify ownership survived into the ext4 image
        run: |
          # 抽查几个非 root 属主：若这里报错，说明上面的 fakeroot 会话又被拆开了
          check() { # check <path> <regex>
            if debugfs -R "stat $1" rootfs.ext4 2>/dev/null | grep -qE "$2"; then
              echo "  OK   $1  ($2)"
            else
              debugfs -R "stat $1" rootfs.ext4 2>/dev/null | grep -E 'User:|Group:|Mode:'
              echo "::error::$1 的属主/权限没进 ext4（期望 $2）"
              exit 1
            fi
          }
          check /var/lib/mpd        'User: *102'
          check /var/lib/mpd/music  'User: *102'
          check /etc/shadow         'Group: *42'
          check /usr/bin/sudo       'Mode: *04755'
          echo "ext4 属主/权限保留正常"

      - name: Verify defaults landed in the image
        run: |
          check() { # check <path> <说明>
            if debugfs -R "stat $1" rootfs.ext4 >/dev/null 2>&1; then
              echo "  OK   $1  ($2)"
            else
              echo "::error::镜像里缺 $1（$2）"
              exit 1
            fi
          }
          check /etc/systemd/network/10-eth0.link  "网卡固定为 eth0"
          check /var/lib/alsa/asound.state         "开机音量默认值"
          check /etc/localtime                     "时区 Asia/Shanghai"
          check /etc/motd                          "登录横幅"

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-rootfs
          path: |
            rootfs.tar.zst
            rootfs.ext4
          if-no-files-found: error
          retention-days: 14

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debian-build-log
          path: mmdebstrap.log
          if-no-files-found: ignore
          retention-days: 7
