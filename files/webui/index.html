<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a1a2e">
<title>ZYBO Audio</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
       background:#0f0f1a;color:#e0e0e0;min-height:100vh;
       display:flex;justify-content:center;padding:12px;
       -webkit-tap-highlight-color:transparent}
  .app{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}

  /* header */
  .header{text-align:center;padding:4px 0;
          font-size:13px;color:#9a9ab0;letter-spacing:2px;text-transform:uppercase}
  .header #app-ver{font-size:10px;letter-spacing:1px;color:#8f95a8}
  /* Engine self-description: every "is this available" decision comes from here */
  .engine-line{text-align:center;font-size:10px;color:#7d8299;line-height:1.5}
  .engine-line b{color:#8f95a8;font-weight:600}

  /* now-playing */
  .card{background:#1a1a2e;border-radius:14px;padding:16px;text-align:center}
  .card .art{width:80px;height:80px;border-radius:12px;background:#25253e;
             margin:0 auto 12px;display:flex;align-items:center;justify-content:center;
             font-size:36px}
  .card .title{font-size:16px;font-weight:600;margin-bottom:4px;
                white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .artist{font-size:13px;color:#999}
  .card .source-badge{display:inline-block;margin-top:8px;padding:3px 10px;
                       border-radius:12px;font-size:11px;font-weight:600;
                       background:#25253e;color:#7c8aff}

  /* source selector */
  .source-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .src-btn{flex:1;min-width:70px;padding:10px 4px;border-radius:10px;
            background:#1a1a2e;border:2px solid transparent;
            color:#999;font-size:12px;font-weight:600;cursor:pointer;
            transition:all .15s;text-align:center}
  .src-btn.active{border-color:#7c8aff;color:#7c8aff;background:#1a1a3e}
  .src-btn:active{transform:scale(.96)}
  .src-btn:disabled{opacity:.35;cursor:not-allowed}

  /* generic */
  .section-title{font-size:11px;color:#9a9ab0;letter-spacing:3px;
                 text-transform:uppercase;text-align:center;margin-bottom:-6px}
  .panel{background:#1a1a2e;border-radius:14px;padding:14px 12px}
  .hint{font-size:10px;color:#7d8299;line-height:1.5;margin-top:6px;text-align:center}
  .row-wrap{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .btn{padding:8px 14px;min-height:32px;border-radius:8px;background:#25253e;
       border:1px solid transparent;color:#999;font-size:11px;font-weight:600;
       cursor:pointer;transition:all .15s}
  .btn.active{border-color:#7c8aff;color:#7c8aff}
  .btn:active{transform:scale(.96)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.primary{background:#2a2a4e;color:#a8b0ff}
  .btn.danger:hover{border-color:#c4646e;color:#c4646e}
  .btn.sm{padding:5px 9px;min-height:26px;font-size:10px}

  /* Notice bar: whatever the backend says is shown verbatim, never swallowed */
  .notice{border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5;
          background:#3a2530;color:#f0a8b4;border:1px solid #5c3540}
  .notice.warn{background:#3a3525;color:#e8cf9a;border-color:#5c5232}
  .notice.ok{background:#223a2c;color:#9fd8b4;border-color:#2f5540}
  .notice .nt-h{font-weight:700;margin-bottom:3px}
  .notice ul{margin:4px 0 0 16px}

  /* sound type */
  .type-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .type-item{padding:8px 12px;min-height:34px;border-radius:9px;background:#25253e;
             border:1px solid transparent;color:#c9c9dc;font-size:12px;font-weight:600;
             cursor:pointer;display:flex;align-items:center;gap:5px}
  .type-item.active{border-color:#7c8aff;color:#a8b0ff;background:#1a1a3e}
  .type-item .mk{font-size:9px;color:#7d8299}
  .type-item.active .mk{color:#8f95a8}

  /* effect cards */
  .fx-list{display:flex;flex-direction:column;gap:8px}
  .fx{background:#1a1a2e;border-radius:12px;padding:12px;border:1px solid transparent}
  .fx.on{border-color:#3d5a8a}
  .fx.grey{opacity:.5}
  .fx-head{display:flex;align-items:flex-start;gap:10px}
  .fx-main{flex:1;min-width:0}
  .fx-name{font-size:13px;font-weight:600;color:#dcdcf0;display:flex;align-items:center;gap:6px}
  .fx-tag{font-size:9px;padding:1px 5px;border-radius:6px;background:#25253e;color:#8f95a8;font-weight:600}
  .fx-desc{font-size:11px;color:#8f95a8;margin-top:3px;line-height:1.45}
  .fx-why{font-size:10px;color:#c9a06a;margin-top:4px;line-height:1.45}
  /* The switch is a button, so it is easy to tap (and to test) */
  .fx-sw{width:42px;height:24px;border-radius:12px;background:#25253e;border:none;
         position:relative;cursor:pointer;flex:0 0 auto;transition:background .15s}
  .fx-sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;
                border-radius:50%;background:#8f95a8;transition:all .15s}
  .fx-sw.on{background:#3d5a8a}
  .fx-sw.on::after{left:21px;background:#fff}
  .fx-sw:disabled{cursor:not-allowed}
  .fx-body{margin-top:10px;padding-top:10px;border-top:1px solid #25253e;
           display:flex;flex-direction:column;gap:10px}
  .fx-x{background:transparent;border:none;color:#7d8299;font-size:12px;
        cursor:pointer;padding:2px 4px;border-radius:6px}
  .fx-x:hover{color:#c4646e;background:#25253e}

  /* One control row: label + slider + value */
  .ctl{display:flex;align-items:center;gap:8px}
  .ctl .lb{font-size:10px;color:#8f95a8;min-width:40px}
  /* The slider ELEMENT must be 28px tall (that is the hit area); the thin track
     is drawn by the track pseudo-element. It used to be height:6px -- visually
     fine, but the hit area was only 6px, unusable on a phone (found by measuring, WCAG wants >=24px). */
  .ctl input[type=range]{flex:1;height:28px;background:transparent;
       -webkit-appearance:none;appearance:none;outline:none;min-width:0}
  .ctl input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#25253e}
  .ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
       width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-7px;
       border:2px solid #7c8aff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .ctl input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#25253e}
  .ctl input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:#7c8aff}
  .ctl input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;
       background:#fff;border:2px solid #7c8aff}
  .ctl .val{font-size:10px;color:#a8b0ff;min-width:56px;text-align:right;
            font-variant-numeric:tabular-nums}
  .strength{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .strength .lb{font-size:10px;color:#8f95a8;margin-right:2px}

  /* genre presets (secondary, collapsed by default) */
  details.presets>summary{cursor:pointer;font-size:11px;color:#9a9ab0;
        letter-spacing:3px;text-transform:uppercase;text-align:center;list-style:none}
  details.presets>summary::-webkit-details-marker{display:none}
  .pst-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
  .pst-item{display:flex;align-items:center;gap:6px;background:#25253e;border-radius:9px;
            padding:7px 9px;border:1px solid transparent}
  .pst-item.active{border-color:#7c8aff}
  .pst-item.grey{opacity:.5}
  .pst-item .nm{font-size:11px;font-weight:600;color:#c9c9dc;cursor:pointer;
                max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pst-item.active .nm{color:#a8b0ff}
  .pst-item .mini{font-size:9px;color:#7d8299}

  /* volume / status / reboot */
  .vol-row{display:flex;align-items:center;gap:10px;padding:4px 8px}
  .vol-row .icon{font-size:22px}
  /* Same for the volume slider: tall hit area, thin track */
  .vol-row input[type=range]{flex:1;height:28px;background:transparent;
       -webkit-appearance:none;appearance:none;outline:none}
  .vol-row input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#25253e}
  .vol-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
       width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #7c8aff;margin-top:-9px}
  .vol-row input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#25253e}
  .vol-row input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:#7c8aff}
  .vol-row input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
       background:#fff;border:2px solid #7c8aff}
  .vol-row .pct{font-size:14px;font-weight:600;color:#7c8aff;min-width:36px;text-align:right}
  .vol-row .db{font-size:11px;color:#8b8ba7;min-width:44px;text-align:right}
  .status-bar{display:flex;justify-content:center;gap:16px;font-size:10px;color:#8f95a8;padding:4px 0}
  .sys-row{display:flex;align-items:center;justify-content:center;gap:10px;
           font-size:10px;color:#8f95a8;padding:6px 0 0}
  .sys-btn{padding:5px 12px;border-radius:7px;background:transparent;border:1px solid #3a3a55;
           color:#8f95a8;font-size:11px;cursor:pointer}
  .sys-btn:hover{border-color:#c4646e;color:#c4646e}
  .sys-btn:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>

<div class="app">

  <div class="header">ZYBO Audio <span id="app-ver"></span></div>
  <div class="engine-line" id="engine-line"></div>

  <!-- Now Playing -->
  <div class="card" id="now-playing">
    <div class="art" id="art">🎵</div>
    <div class="title" id="np-title">Not playing</div>
    <div class="artist" id="np-artist">No source selected</div>
    <div><span class="source-badge" id="source-badge">Idle</span></div>
  </div>

  <!-- Source -->
  <div class="source-row" id="source-row">
    <button class="src-btn active" data-src="idle"      id="src-idle">🛑 Stop</button>
    <button class="src-btn"        data-src="airplay"   id="src-airplay">📱 AirPlay</button>
    <button class="src-btn"        data-src="dlna"      id="src-dlna">🏠 DLNA</button>
    <button class="src-btn"        data-src="bluetooth" id="src-bt">🎧 Bluetooth</button>
  </div>

  <div class="notice" id="notice" hidden></div>

  <!-- Sound type -->
  <div class="section-title">Sound type</div>
  <div class="panel">
    <div class="type-list" id="type-list"></div>
    <div class="row-wrap" id="type-actions"></div>
    <div class="hint" id="type-hint"></div>
  </div>

  <!-- Effects: this type's own set of cards -->
  <div class="section-title">Effects</div>
  <div class="fx-list" id="fx-list"></div>
  <div class="panel" style="margin-top:8px">
    <div class="row-wrap" style="margin-top:0" id="fx-actions"></div>
    <div class="hint" id="fx-hint"></div>
  </div>

  <!-- Genre presets (secondary) -->
  <details class="presets">
    <summary>Genre presets</summary>
    <div class="panel" style="margin-top:10px">
      <div class="pst-list" id="preset-list"></div>
      <div class="row-wrap">
        <button class="btn" id="btn-save-preset">💾 Save preset</button>
        <button class="btn" id="btn-import" title="Import a custom JSON preset, REW text or AutoEQ text">📥 Import</button>
        <a class="btn" id="btn-export-rew" href="/api/dsp/export?format=rew" download
           style="text-decoration:none;display:inline-flex;align-items:center">📤 Export EQ (REW)</a>
        <input type="file" id="file-import" accept=".txt,.json" style="display:none">
      </div>
      <div class="hint" id="preset-hint"></div>
    </div>
  </details>

  <!-- Volume -->
  <div class="section-title">Volume</div>
  <div class="vol-row">
    <span class="icon">🔈</span>
    <input type="range" id="vol-slider" min="-60" max="0" value="-12" step="1">
    <span class="icon">🔊</span>
    <span class="pct" id="vol-pct">80%</span>
    <span class="db" id="vol-db">--</span>
  </div>

  <div class="status-bar" id="status-bar">
    <span>CPU <span id="sys-cpu">--</span>%</span>
    <span>RAM <span id="sys-ram">--</span>MB</span>
    <span>Uptime <span id="sys-uptime">--</span></span>
  </div>

  <div class="sys-row">
    <button class="sys-btn" id="btn-reboot">Reboot</button>
    <span id="sys-note"></span>
  </div>

</div>

<script>
// ════════════════════════════════════════════════════════════════════════
// Panel layout (0.2 second revision: no wizard, just "sound type -> effect cards -> values")
//
//   sound type (headphones / small speakers / amp / custom)
//     +-- this type's OWN set of effect cards (types can differ completely:
//         headphones may have 3, the amp may have only "Limiter protection")
//           +-- each card expands to its own controls (sliders / buttons)
//
// Three rules run through this file:
//
// 1. The HARDWARE decides what is available: band limit, whether a true-peak
//    limiter exists, which effects are still planned -- all read from capabilities.
// 2. If it does not fit, say so: the backend's own message is shown, never truncated.
// 3. Card controls are driven by the effect catalog below: each card declares its kind
//    and the renderer draws it. Adding a new effect = one catalog entry, one kind branch;
//    no layout work and no backend change (a type is a generic container).
// ════════════════════════════════════════════════════════════════════════

// -- Effect catalog (data driven: adding an effect only touches this table) --
// kind：
//   'bands'   - built from biquad sections (strength step x weight = section gain)
//   'limiter' - the limiter stage at the end of the chain (on/off, mode, threshold)
// Entries with only `requires` need a newer engine; the UI greys them out and says why.
const EFFECTS = [
  { id:'bass',    name:'Deep bass',   desc:'Hear the low end even at low volume', stage:'P0', kind:'bands',
    bands:[{freq:60,q:0.7,g:1.0},{freq:150,q:0.8,g:0.7}] },
  { id:'vocal',   name:'Clear vocals',   desc:'Voices and dialogue step out of the mix', stage:'P0', kind:'bands',
    bands:[{freq:400,q:0.8,g:-0.5},{freq:1000,q:1.0,g:0.9},{freq:3000,q:1.0,g:1.0}] },
  { id:'vocalhd', name:'Detailed vocals', desc:'Brighter lead voices', stage:'P0', kind:'bands',
    bands:[{freq:400,q:0.8,g:-0.5},{freq:1000,q:1.0,g:0.8},{freq:3000,q:1.2,g:1.0},
           {freq:6000,q:1.0,g:0.6}] },
  { id:'soft',    name:'Easy listening',   desc:'Tame harsh treble, comfortable for hours', stage:'P0', kind:'bands',
    bands:[{freq:3000,q:1.0,g:-0.7},{freq:10000,q:0.8,g:-1.0}] },
  { id:'night',   name:'Late-night', desc:'Stay intelligible at low volume', stage:'P0', kind:'bands',
    bands:[{freq:60,q:0.7,g:0.8},{freq:150,q:0.8,g:0.6},{freq:3000,q:1.0,g:-0.3},
           {freq:10000,q:0.8,g:0.5}] },
  { id:'limiter', name:'Limiter protection',   desc:'Prevents clipping and pops', stage:'P0', kind:'limiter' },
  // Planned: the reason comes from capabilities.planned and is shown as-is
  { id:'spatial', name:'3D / headphone stage', desc:'Move the image from inside your head to in front',
    stage:'P2', requires:['crossfeed'] },
  { id:'widener', name:'Stereo widening',   desc:'Wider, more enveloping image',
    stage:'P2', requires:['widener'] },
];

const STRENGTH_DB = { light: 2, mid: 4, strong: 6 };
const STRENGTH_LABEL = { light:'Light', mid:'Medium', strong:'Strong' };

// -- Parameter ranges (match the backend clamp; never offer a value it would clamp) --
const FREQ_MIN = 60, FREQ_MAX = 20000, GAIN_LIM = 24, Q_MIN = 0.1, Q_MAX = 10;
const SLIDER_STEPS = 1000;
// Frequency and Q use a LOG scale: spread linearly, 60..20000 squeezes all bass to one end.
const freqFromSlider = v => FREQ_MIN * Math.pow(FREQ_MAX / FREQ_MIN, v / SLIDER_STEPS);
const sliderFromFreq = f => SLIDER_STEPS * Math.log(f / FREQ_MIN) / Math.log(FREQ_MAX / FREQ_MIN);
const qFromSlider    = v => Q_MIN * Math.pow(Q_MAX / Q_MIN, v / SLIDER_STEPS);
const sliderFromQ    = q => SLIDER_STEPS * Math.log(q / Q_MIN) / Math.log(Q_MAX / Q_MIN);

// ── State ─────────────────────────────────────────────────────────────
let state = {};          // /api/status
let caps = null;         // /api/dsp/capabilities
let types = [];          // /api/dsp/types
let curName = '';        // currently selected type
let curEffects = [];     // that type's cards (working copy)
let presets = [];        // genre presets
// dirty: has the user actually CHANGED this type's settings?
// Merely looking at a built-in type must not write it to disk, otherwise
// tapping "Headphones" creates a same-named user type that shadows the built-in one.
let dirty = false;
const API = '';

const SRC_LABEL = { airplay:'AirPlay', bluetooth:'Bluetooth', dlna:'DLNA' };
const SRC_HINT = {
  airplay:   'Cast to ZYBO Audio from your phone',
  bluetooth: 'Pair ZYBO Audio from your phone',
  dlna:      'Waiting for a push',
};

// -- Small DOM helpers --
function $(id){ return document.getElementById(id) }
function setText(id,t){ const e=$(id); if(e)e.textContent=t }
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined && text !== null) e.textContent = text;
  return e;
}
function effectDef(id){ return EFFECTS.find(function(e){ return e.id === id }) }

// -- Notice bar (the only error outlet; no alert(), jsdom would swallow it) --
let noticeTimer = null;
function showNotice(msg, kind, details){
  const n = $('notice');
  if(!n) return;
  n.hidden = false;
  n.className = 'notice' + (kind && kind !== 'err' ? ' '+kind : '');
  n.innerHTML = '';
  n.appendChild(el('div','nt-h', msg));
  if(details && details.length){
    const ul = el('ul');
    details.forEach(function(d){ ul.appendChild(el('li', null, d)) });
    n.appendChild(ul);
  }
  if(noticeTimer) clearTimeout(noticeTimer);
  if(kind === 'ok') noticeTimer = setTimeout(clearNotice, 4000);   // success fades, errors stay
}
function clearNotice(){ const n = $('notice'); if(n){ n.hidden = true; n.innerHTML='' } }

// -- HTTP: surface the backend's own message (errors are {"error":"..."}) --
async function api(path, opts){
  const r = await fetch(API + path, opts);
  const text = await r.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null } catch(e){}
  if(!r.ok){
    const err = new Error((body && body.error) ? body.error : ('HTTP ' + r.status));
    err.status = r.status;
    throw err;
  }
  return body;
}
function postJSON(path, obj, method){
  return api(path, { method: method || 'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(obj) });
}

// -- Capabilities -> UI --
function maxBands(){ return (caps && caps.bands) ? caps.bands : 6 }
function truepeakAvailable(){ return !!(caps && caps.limiter && caps.limiter.truepeak_available) }
function plannedReason(requires){
  if(!requires || !caps || !caps.planned) return '';
  const out = [];
  requires.forEach(function(t){ const why = caps.planned[t]; if(why) out.push(why) });
  return out.join('；');
}
function renderEngineLine(){
  const line = $('engine-line');
  if(!line) return;
  if(!caps){ line.textContent = 'Reading engine capabilities...'; return }
  const parts = [ caps.engine === 'slot-table' ? 'slot-table engine' : 'fixed 6-band',
                  'up to ' + caps.bands + ' bands',
                  truepeakAvailable() ? 'true-peak limiter available' : 'no true-peak limiter' ];
  if(caps.dsp_available === false) parts.push('DSP unavailable');
  line.innerHTML = '';
  line.appendChild(el('b','Engine: '));
  line.appendChild(document.createTextNode(parts.join(' · ')));
}
async function loadCaps(){
  try { caps = await api('/api/dsp/capabilities') }
  catch(e){ caps = null; showNotice('Cannot read engine capabilities: ' + e.message) }
  renderEngineLine();
}

// -- Sound types --
async function loadTypes(){
  try {
    const d = await api('/api/dsp/types');
    types = d.types || [];
    BUILTIN_NAMES = d.builtin_names || [];
  } catch(e){
    types = [];
    showNotice('Cannot read sound types: ' + e.message);
  }
}
function curType(){ return types.find(function(t){ return t.name === curName }) }
// The built-in type names come FROM THE BACKEND (builtin_names in GET /api/dsp/types);
// they are not hardcoded here -- a name is backend data and the UI only relays it.
// Once a user edits one it shows up as a same-named user type, so "restore built-in" is offered.
let BUILTIN_NAMES = [];

// Deep-copy effects into a working copy (never mutate the objects inside `types`)
function cloneEffects(list){
  return (list || []).map(function(e){
    return { id:e.id, enabled:!!e.enabled, mode:e.mode || '',
             params: Object.assign({}, e.params || {}),
             bands: (e.bands || []).map(function(b){
               return { type:b.type || 'peq', enabled:true,
                        freq:+b.freq, gain_db:+b.gain_db, q:+b.q };
             }) };
  });
}

function renderTypes(){
  const box = $('type-list');
  if(!box) return;
  box.innerHTML = '';
  types.forEach(function(t){
    const b = el('div','type-item' + (t.name === curName ? ' active' : ''));
    b.dataset.type = t.name;
    b.appendChild(document.createTextNode(t.name));
    b.appendChild(el('span','mk', t.builtin ? 'built-in' : 'mine'));
    b.addEventListener('click', function(){ selectType(t.name) });
    box.appendChild(b);
  });
  if(!types.length) box.appendChild(el('div','hint','No sound types yet'));

  const acts = $('type-actions');
  if(acts){
    acts.innerHTML = '';
    const add = el('button','btn sm primary','+ New type');
    add.id = 'type-new';
    add.addEventListener('click', newType);
    acts.appendChild(add);

    const t = curType();
    if(t){
      const copy = el('button','btn sm','Copy');
      copy.id = 'type-copy';
      copy.addEventListener('click', copyType);
      acts.appendChild(copy);

      if(!t.builtin){
        const ren = el('button','btn sm','Rename');
        ren.id = 'type-rename';
        ren.addEventListener('click', renameType);
        acts.appendChild(ren);

        const del = el('button','btn sm danger','Delete');
        del.id = 'type-delete';
        del.addEventListener('click', deleteType);
        acts.appendChild(del);
      }
      if(!t.builtin && BUILTIN_NAMES.indexOf(t.name) >= 0){
        const rst = el('button','btn sm','Restore built-in');
        rst.id = 'type-restore';
        rst.addEventListener('click', restoreBuiltin);
        acts.appendChild(rst);
      }
    }
  }
  const hint = $('type-hint');
  if(hint){
    hint.textContent = curName
      ? ('Type "' + curName + '" has ' + curEffects.length +
         ' effect card(s); switching type swaps the whole set, and edits are remembered.')
      : 'Pick a sound type first.';
  }
}

async function selectType(name){
  const t = types.find(function(x){ return x.name === name });
  if(!t) return;
  curName = name;
  curEffects = cloneEffects(t.effects);
  dirty = false;        // just looking: apply its settings, do not save
  renderTypes(); renderCards();
  await applyNow();     // switching type swaps everything: push it now
}

// working copy -> the in-memory types entry (the visible content must follow)
function syncCurType(){
  const t = curType();
  if(t) t.effects = cloneEffects(curEffects);
}

async function newType(){
  const name = (window.prompt && window.prompt('Name for the new type?', 'My device')) || '';
  if(!name.trim()) return;
  if(types.some(function(t){ return t.name === name.trim() })){
    showNotice('A type with that name already exists', 'warn', ['Pick another name, or select it and edit that one.']);
    return;
  }
  types.push({ name:name.trim(), note:'', builtin:false, effects: cloneEffects(curEffects) });
  curName = name.trim();
  renderTypes(); renderCards(); await applyNow();
  showNotice('Created type "' + curName + '" (copied from the current one)', 'ok');
}

async function copyType(){
  const name = (window.prompt && window.prompt('Copy as?', curName + ' 2')) || '';
  if(!name.trim()) return;
  if(types.some(function(t){ return t.name === name.trim() })){
    showNotice('A type with that name already exists', 'warn', []);
    return;
  }
  types.push({ name:name.trim(), note:'', builtin:false, effects: cloneEffects(curEffects) });
  curName = name.trim();
  renderTypes(); renderCards(); await applyNow();
  showNotice('Copied to "' + curName + '"', 'ok');
}

async function renameType(){
  const t = curType();
  if(!t || t.builtin) return;
  const to = (window.prompt && window.prompt('New name?', t.name)) || '';
  if(!to.trim() || to.trim() === t.name) return;
  try {
    await postJSON('/api/dsp/types/rename', { from:t.name, to:to.trim() });
    await loadTypes();
    curName = to.trim();
    curEffects = cloneEffects(curType() ? curType().effects : []);
    renderTypes(); renderCards();
    showNotice('Renamed to "' + curName + '"', 'ok');
  } catch(e){ showNotice('Rename failed', 'err', [e.message]) }
}

async function deleteType(){
  const t = curType();
  if(!t || t.builtin) return;
  if(!(window.confirm && window.confirm('Delete the type "' + t.name + '"?'))) return;
  try {
    await postJSON('/api/dsp/types/delete', { name:t.name });
    await loadTypes();
    curName = types.length ? types[0].name : '';
    curEffects = cloneEffects(curType() ? curType().effects : []);
    renderTypes(); renderCards(); await applyNow();
    showNotice('Deleted', 'ok');
  } catch(e){ showNotice('Delete failed', 'err', [e.message]) }
}

// "Restore built-in" = delete the same-named user type so the built-in one shows again
async function restoreBuiltin(){
  const t = curType();
  if(!t || t.builtin) return;
  if(!(window.confirm && window.confirm('Restore "' + t.name + '" to its built-in settings? Your changes are lost.'))) return;
  try {
    await postJSON('/api/dsp/types/delete', { name:t.name });
    await loadTypes();
    const back = types.find(function(x){ return x.name === t.name });
    curEffects = cloneEffects(back ? back.effects : []);
    renderTypes(); renderCards(); await applyNow();
    showNotice('Restored the built-in settings', 'ok');
  } catch(e){ showNotice('Restore failed', 'err', [e.message]) }
}

// -- Effect cards --
function fxState(id){ return curEffects.find(function(e){ return e.id === id }) }

function renderCards(){
  const box = $('fx-list');
  if(!box) return;
  box.innerHTML = '';
  curEffects.forEach(function(fx, idx){
    const def = effectDef(fx.id);
    const grey = !!(def && def.requires);
    const div = el('div','fx' + (fx.enabled && !grey ? ' on' : '') + (grey ? ' grey' : ''));
    div.dataset.fx = fx.id;

    const head = el('div','fx-head');
    const main = el('div','fx-main');
    const nm = el('div','fx-name');
    nm.appendChild(document.createTextNode(def ? def.name : fx.id));
    if(def && def.stage) nm.appendChild(el('span','fx-tag', def.stage));
    main.appendChild(nm);
    if(def && def.desc) main.appendChild(el('div','fx-desc', def.desc));
    if(grey) main.appendChild(el('div','fx-why', plannedReason(def.requires) || 'Not supported by this engine yet'));
    head.appendChild(main);

    if(!grey){
      const rm = el('button','fx-x','✕');
      rm.title = 'Remove this card from the type';
      rm.setAttribute('aria-label','Remove ' + (def ? def.name : fx.id));
      rm.addEventListener('click', function(ev){
        ev.stopPropagation();
        curEffects.splice(idx,1); dirty = true; syncCurType(); renderCards(); applyCurrent();
      });
      head.appendChild(rm);
    }

    const sw = el('button','fx-sw' + (fx.enabled && !grey ? ' on' : ''));
    sw.setAttribute('aria-label', (def ? def.name : fx.id) + ' switch');
    if(grey) sw.disabled = true;
    sw.addEventListener('click', function(ev){
      ev.stopPropagation();
      if(grey) return;
      fx.enabled = !fx.enabled;
      if(fx.enabled && def && def.kind === 'bands' && (!fx.bands || !fx.bands.length)){
        fx.mode = fx.mode || 'mid';
        fx.bands = bandsFromStrength(def, fx.mode);   // first time on: lay out sections at the default step
      }
      dirty = true; syncCurType(); renderCards(); applyCurrent();
    });
    head.appendChild(sw);
    div.appendChild(head);

    // The values only appear while the card is ON (when off they mean nothing)
    if(fx.enabled && !grey){
      const body = el('div','fx-body');
      const kind = def ? def.kind : '';
      if(kind === 'bands') renderBandControls(body, fx, def);
      else if(kind === 'limiter') renderLimiterControls(body, fx);
      else body.appendChild(el('div','hint','This effect has no adjustable values yet'));
      div.appendChild(body);
    }
    box.appendChild(div);
  });
  if(!curEffects.length) box.appendChild(el('div','hint','This type has no effect cards yet'));
  renderFxActions();
}

// strength step x weight -> section gains
function bandsFromStrength(def, mode){
  const base = STRENGTH_DB[mode] || STRENGTH_DB.mid;
  return def.bands.map(function(b){
    return { type:'peq', enabled:true, freq:b.freq,
             gain_db:+(base*b.g).toFixed(1), q:b.q };
  });
}

function renderBandControls(body, fx, def){
  const st = el('div','strength');
  st.appendChild(el('span','lb','Strength'));
  ['light','mid','strong'].forEach(function(k){
    const b = el('button','btn sm' + (fx.mode === k ? ' active' : ''), STRENGTH_LABEL[k]);
    b.dataset.strength = k;
    b.addEventListener('click', function(){
      fx.mode = k;
      fx.bands = bandsFromStrength(def, k);   // new step = lay the sections out again (then tweak each)
      dirty = true; syncCurType(); renderCards(); applyCurrent();
    });
    st.appendChild(b);
  });
  body.appendChild(st);

  fx.bands.forEach(function(band, bi){
    body.appendChild(sliderRow('Freq', sliderFromFreq(band.freq), function(v){
      band.freq = +freqFromSlider(v).toFixed(0);
      return band.freq + ' Hz';
    }, bi, 'freq'));
    body.appendChild(sliderRow('Gain', (band.gain_db + GAIN_LIM) / (2*GAIN_LIM) * SLIDER_STEPS,
    function(v){
      band.gain_db = +(v / SLIDER_STEPS * 2*GAIN_LIM - GAIN_LIM).toFixed(1);
      return (band.gain_db >= 0 ? '+' : '') + band.gain_db.toFixed(1) + ' dB';
    }, bi, 'gain'));
    body.appendChild(sliderRow('Q', sliderFromQ(band.q), function(v){
      band.q = +qFromSlider(v).toFixed(2);
      return band.q.toFixed(2);
    }, bi, 'q'));
  });
}

// One row = label + slider + value. Dragging only updates the value cell
// (never re-lays-out the DOM under a finger); pushing is debounced.
function sliderRow(label, initVal, write, bandIndex, which){
  const row = el('div','ctl');
  row.appendChild(el('span','lb', label));
  const inp = document.createElement('input');
  inp.type = 'range';
  inp.min = 0; inp.max = SLIDER_STEPS; inp.step = 1;
  inp.value = Math.max(0, Math.min(SLIDER_STEPS, Math.round(initVal)));
  inp.dataset.band = bandIndex; inp.dataset.param = which;
  const val = el('span','val','');
  inp.addEventListener('input', function(){
    val.textContent = write(parseFloat(inp.value));
    dirty = true; syncCurType();
    applyCurrent();
  });
  val.textContent = write(parseFloat(inp.value));
  row.appendChild(inp);
  row.appendChild(val);
  return row;
}

function renderLimiterControls(body, fx){
  const st = el('div','strength');
  st.appendChild(el('span','lb','Mode'));
  [['feedback','Legacy (no lookahead)'],['truepeak','True-peak (lookahead)']].forEach(function(pair){
    const b = el('button','btn sm' + ((fx.mode || 'feedback') === pair[0] ? ' active' : ''), pair[1]);
    b.dataset.mode = pair[0];
    if(pair[0] === 'truepeak' && !truepeakAvailable()){
      b.disabled = true;
      b.title = 'This bitstream has no true-peak limiter';
    }
    b.addEventListener('click', function(){
      if(pair[0] === 'truepeak' && !truepeakAvailable()){
        showNotice('This bitstream has no true-peak limiter', 'warn',
          ['Older bitstreams only carry the feedback limiter; this becomes clickable with a newer one']);
        return;
      }
      fx.mode = pair[0]; dirty = true; syncCurType(); renderCards(); applyCurrent();
    });
    st.appendChild(b);
  });
  body.appendChild(st);

  const p = fx.params || {};
  const thr = (typeof p.thr_db === 'number') ? p.thr_db : -1;
  body.appendChild(sliderRow('Threshold', (thr + 24) / 24 * SLIDER_STEPS, function(v){
    const db = +(v / SLIDER_STEPS * 24 - 24).toFixed(1);
    fx.params = fx.params || {};
    fx.params.thr_db = db;
    return db.toFixed(1) + ' dBFS';
  }, 0, 'thr'));

  const hint = el('div','hint','');
  const L = (caps && caps.limiter) || {};
  if((fx.mode || 'feedback') === 'truepeak' && typeof L.att_ms === 'number'){
    hint.textContent = 'True-peak: 2 ms lookahead, bit-transparent below threshold; actual time constants ' +
      L.att_ms.toFixed(2) + ' ms / ' + L.rel_ms.toFixed(0) + ' ms (max ' + L.rel_ms_max + ' ms)';
  } else {
    hint.textContent = 'Legacy: no lookahead, so 0 dBFS material shows waveform discontinuities (thousands per second).';
  }
  body.appendChild(hint);
}

function renderFxActions(){
  const acts = $('fx-actions');
  if(!acts) return;
  acts.innerHTML = '';
  // Any effect this type does not have yet can be added (each type has its own cards)
  const available = EFFECTS.filter(function(def){
    return !curEffects.some(function(fx){ return fx.id === def.id });
  });
  if(available.length){
    const pick = document.createElement('select');
    pick.id = 'fx-pick';
    pick.style.cssText = 'background:#25253e;border:1px solid #2f2f48;border-radius:8px;'+
                         'color:#dcdcf0;font-size:11px;padding:6px 8px';
    available.forEach(function(def){
      const o = document.createElement('option');
      o.value = def.id;
      o.textContent = def.requires ? (def.name + ' (needs a newer engine)') : def.name;
      pick.appendChild(o);
    });
    acts.appendChild(pick);
    const add = el('button','btn sm primary','+ Add this card');
    add.id = 'fx-add';
    add.addEventListener('click', function(){
      const def = effectDef(pick.value);
      if(!def) return;
      const fx = { id:def.id, enabled:!def.requires, mode:'mid', params:{}, bands:[] };
      if(def.kind === 'bands') fx.bands = bandsFromStrength(def, 'mid');
      if(def.kind === 'limiter'){
        fx.enabled = true; fx.mode = truepeakAvailable() ? 'truepeak' : 'feedback';
        fx.params = { thr_db:-1, att_ms:0.09, rel_ms:43 };
      }
      curEffects.push(fx);
      dirty = true; syncCurType(); renderCards(); applyCurrent();
    });
    acts.appendChild(add);
  }
  const hint = $('fx-hint');
  if(hint){
    const used = enabledBands();
    hint.textContent = 'Using ' + used + ' / ' + maxBands() + ' bands' +
      (used > maxBands() ? ' (over the limit, applying will be rejected)' : '') +
      '; these cards belong to the type "' + curName + '"';
    hint.style.color = used > maxBands() ? '#f0a8b4' : '';
  }
}

function enabledBands(){
  let n = 0;
  curEffects.forEach(function(fx){
    if(!fx.enabled) return;
    const def = effectDef(fx.id);
    if(def && def.kind === 'bands') n += (fx.bands || []).length;
  });
  return n;
}

// -- Pushing to the hardware (debounced) --
let applyTimer = null;
function applyCurrent(){           // collapse a drag into one push
  if(applyTimer) clearTimeout(applyTimer);
  applyTimer = setTimeout(applyNow, 250);
}

async function applyNow(){
  if(applyTimer){ clearTimeout(applyTimer); applyTimer = null }

  // (1) chain: collect the sections of every enabled bands effect, sorted by frequency
  const items = [];
  curEffects.forEach(function(fx){
    if(!fx.enabled) return;
    const def = effectDef(fx.id);
    if(!def || def.kind !== 'bands') return;
    (fx.bands || []).forEach(function(b){
      items.push({ type:b.type || 'peq', enabled:true,
                   freq:+b.freq, gain_db:+b.gain_db, q:+b.q });
    });
  });
  items.sort(function(a,b){ return a.freq - b.freq });

  if(items.length > maxBands()){
    // No truncation: say what the backend would say (it will refuse as well)
    showNotice('This type needs ' + items.length + ' bands, this device has ' + maxBands() + ' bands',
      'err', ['Turn a card off or enable fewer sections; nothing is dropped for you silently.']);
  } else {
    try {
      const d = await postJSON('/api/dsp/chain', { chain: items }, 'PUT');
      if(d && typeof d.preamp_db === 'number' && d.preamp_db < -0.05){
        showNotice('Applied (' + d.applied + ' bands). Overall level reduced by ' +
          Math.abs(d.preamp_db).toFixed(1) + ' dB', 'ok');
      }
    } catch(e){
      showNotice('This chain was not applied', 'err', [e.message]);
    }
  }

  // (2) limiter: an optional stage at the end of the chain, not a chain section
  const lim = fxState('limiter');
  if(lim){
    try {
      const p = lim.params || {};
      await postJSON('/api/dsp/limiter', {
        enabled: !!lim.enabled,
        mode: lim.mode || 'feedback',
        thr_db: (typeof p.thr_db === 'number') ? p.thr_db : -1,
      });
    } catch(e){ showNotice('Limiter setting failed', 'err', [e.message]) }
  }

  // (3) remember this type -- only written to disk when the user really changed it
  if(!dirty) return;
  try {
    syncCurType();
    const t = curType();
    if(t){
      await postJSON('/api/dsp/types', { name:t.name, note:t.note || '', effects:curEffects });
      if(t.builtin){ t.builtin = false; renderTypes() }
      dirty = false;
    }
  } catch(e){ showNotice('This type could not be saved', 'err', [e.message]) }
}

// -- Genre presets (secondary) --
async function loadPresets(){
  try {
    const d = await api('/api/dsp/presets');
    presets = d.presets || [];
    renderPresets();
  } catch(e){
    presets = [];
    showNotice('Cannot read the preset list: ' + e.message);
  }
  const hint = $('preset-hint');
  if(hint){
    const nb = caps && caps.presets ? caps.presets.builtin : null;
    hint.textContent = (nb === 0 || nb === null)
      ? 'No built-in library installed -- a packaging matter, not a broken UI'
      : 'Built-in ' + caps.presets.builtin + ' + mine ' + (caps.presets.user || 0) +
        '. Applying a genre preset replaces the current chain (your types are untouched).';
  }
}
function renderPresets(){
  const box = $('preset-list');
  if(!box) return;
  box.innerHTML = '';
  presets.forEach(function(p){ box.appendChild(presetItem(p)) });
  if(!presets.length) box.appendChild(el('div','hint','No presets available yet'));
}
function presetItem(p){
  const item = el('div','pst-item' + (!p.usable ? ' grey' : ''));
  item.dataset.preset = p.name; item.dataset.usable = p.usable ? '1' : '0';
  const nm = el('div','nm', p.name);
  nm.title = (p.why && p.why.length) ? p.why.join('; ') : (p.note || (p.bands + ' bands'));
  if(p.usable) nm.addEventListener('click', function(){ applyPreset(p.name) });
  else nm.addEventListener('click', function(){
    showNotice('"' + p.name + '" is not usable yet', 'warn', p.why || ['needs a newer engine']);
  });
  item.appendChild(nm);
  item.appendChild(el('div','mini', p.usable ? (p.bands + 'bd') : (p.stage || 'planned')));
  return item;
}
async function applyPreset(name){
  try {
    const d = await postJSON('/api/dsp/presets/apply', { name:name });
    if(typeof d.preamp_db === 'number' && d.preamp_db < -0.05){
      showNotice('Applied "' + name + '". Level reduced by ' + Math.abs(d.preamp_db).toFixed(1) + ' dB to avoid clipping', 'ok');
    } else showNotice('Applied "' + name + '"', 'ok');
  } catch(e){
    if(e.status === 409) showNotice('This preset is not usable yet (engine too small)', 'warn', [e.message]);
    else showNotice('Could not apply the preset', 'err', [e.message]);
  }
}
async function savePreset(){
  const name = (window.prompt && window.prompt('Preset name?', 'My sound')) || '';
  if(!name.trim()) return;
  try {
    await postJSON('/api/dsp/presets', { name:name.trim() });
    showNotice('Saved as "' + name.trim() + '"', 'ok');
    await loadPresets();
  } catch(e){ showNotice('Save failed', 'err', [e.message]) }
}
async function importFile(file){
  const text = await file.text();
  const base = file.name.replace(/\.[^.]+$/, '');
  try {
    const d = await api('/api/dsp/presets/import?name=' + encodeURIComponent(base), {
      method:'POST', headers:{'Content-Type':'application/json'}, body:text });
    const warns = (d.warnings || []).slice();
    if(d.apply_error) warns.push('Saved as a preset, but not applied to the hardware: ' + d.apply_error);
    if(warns.length) showNotice('Import finished with ' + warns.length + ' thing(s) to report', 'warn', warns);
    else showNotice('Import finished' + (d.preset ? ': ' + d.preset.name : ''), 'ok');
    await loadPresets();
  } catch(e){ showNotice(e.message, 'err', []) }
}

// -- Status (WebSocket / polling) --
async function fetchStatus(){
  try { const r = await fetch(API + '/api/status'); if(!r.ok) return;
        state = await r.json(); renderStatus() } catch(e){}
}
function connectWS(){
  const proto = location.protocol==='https:'?'wss':'ws';
  let ws;
  try { ws = new WebSocket(proto+'://'+location.host+'/ws') } catch(e){ return }
  ws.onmessage = function(ev){ try { state = JSON.parse(ev.data); renderStatus() } catch(e){} };
  ws.onclose = function(){ setTimeout(connectWS, 2000) };
}
function renderStatus(){
  setText('np-title', state.playing ? (state.title || 'Playing...') : 'Not playing');
  setText('np-artist', state.artist ? state.artist+(state.album?' — '+state.album:'') :
    state.source==='idle' ? 'No source selected' :
    state.playing ? ((SRC_LABEL[state.source]||state.source)+' playing') :
    (SRC_HINT[state.source]||'Waiting for playback'));
  $('source-badge').textContent = state.source==='idle' ? 'Idle' : (SRC_LABEL[state.source]||state.source);
  $('source-badge').style.background = state.source==='idle'?'#25253e':'#2a2a4e';

  ['idle','airplay','dlna','bluetooth'].forEach(function(s){
    const e = $('src-'+s);
    if(!e) return;
    e.classList.toggle('active', state.source===s);
    const avail = (s==='idle') || !state.sources || state.sources[s] !== false;
    e.disabled = !avail;
    e.style.display = avail ? '' : 'none';
    e.title = avail ? '' : 'This source is not installed in this image';
  });

  const vs = $('vol-slider');
  if(vs && document.activeElement !== vs) vs.value = Math.round(-60 + state.volume*0.6);
  setText('vol-pct', state.volume+'%');
  setText('vol-db', fmtDB(state.volume_db, state.volume));
  setText('app-ver', state.version ? 'v'+state.version : '');
  setText('sys-cpu', state.system.cpu_percent);
  setText('sys-ram', state.system.mem_used_mb);
  setText('sys-uptime', fmtUptime(state.system.uptime_sec));
}
function fmtDB(db, pct){
  if(pct <= 0) return 'Muted';
  return (db > 0 ? '+' : '') + db.toFixed(0) + ' dB';
}
function fmtUptime(sec){
  if(!sec || sec<0) return '--';
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
  return h>0 ? h+'h'+m+'m' : m+'m';
}

// -- Event wiring --
document.querySelectorAll('.src-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    const src = this.dataset.src;
    if(src === state.source) return;
    postJSON('/api/source/select', {source:src}).catch(function(e){
      showNotice('Could not switch source', 'err', [e.message]);
    });
  });
});

// The volume slider is the codec's real 1 dB grid (-60..0); the percentage and dB
$('vol-slider').addEventListener('input', function(){
  const db = +this.value;
  const vol = Math.round((db+60)/0.6);
  setText('vol-pct', vol+'%');
  setText('vol-db', fmtDB(db, vol));
  clearTimeout(this._timer);
  this._timer = setTimeout(function(){
    postJSON('/api/volume', {volume:vol}).catch(function(){});
  }, 150);
});

$('btn-save-preset').addEventListener('click', savePreset);
$('btn-import').addEventListener('click', function(){ $('file-import').click() });
$('file-import').addEventListener('change', function(){
  const f = this.files && this.files[0];
  if(!f) return;
  importFile(f); this.value = '';
});

$('btn-reboot').addEventListener('click', function(){
  if(!(window.confirm && window.confirm('Reboot ZYBO Audio?\n\nPlayback stops immediately and this page returns automatically.'))) return;
  const btn = this;
  btn.disabled = true; btn.textContent = 'Rebooting...';
  setText('sys-note', 'The device is rebooting; this page will refresh itself...');
  fetch(API+'/api/reboot', {method:'POST'}).catch(function(){});
  let tries = 0;
  const timer = setInterval(function(){
    tries++;
    fetch(API+'/api/status').then(function(r){
      if(r.ok){ clearInterval(timer); setText('sys-note','Back online, refreshing...'); location.reload() }
    }).catch(function(){});
    if(tries >= 45){
      clearInterval(timer);
      setText('sys-note','Still not back; refresh manually or check the power');
      btn.disabled = false; btn.textContent = 'Reboot';
    }
  }, 2000);
});

// ── Init ──────────────────────────────────────────────────────────────
// Order: capabilities first (band limit, true-peak availability), then types and
// presets. The other way round draws one frame assuming "6 bands and both modes".
(async function init(){
  await loadCaps();
  await Promise.all([loadTypes(), loadPresets()]);
  curName = types.length ? types[0].name : '';
  curEffects = cloneEffects(curType() ? curType().effects : []);
  renderTypes(); renderCards();
  fetchStatus(); connectWS();
})();
</script>
